<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inspirational Quote of the Day application with persistent favorites.">
  <title>Quote of the Day</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1><span>✦</span> Quote of the Day</h1>
      <p>A daily spark of wisdom and inspiration</p>
    </header>

    <article id="quote-card" aria-live="polite">
      <blockquote id="quote-text">Loading inspirational quote...</blockquote>
      <div id="quote-author-wrapper">
        <cite id="quote-author">—</cite>
      </div>
    </article>

    <div class="controls-container">
      <button id="favorite-btn" type="button" aria-pressed="false" aria-label="Toggle favorite">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span id="favorite-text">Favorite</span>
      </button>

      <button id="new-quote-btn" type="button" aria-label="Get another quote">
        <span>New quote</span>
        <span aria-hidden="true">→</span>
      </button>
    </div>

    <footer>
      <p>Client-side only • Favorites saved locally</p>
    </footer>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
